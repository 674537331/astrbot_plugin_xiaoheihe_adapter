[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-plugin-xiaoheihe-adapter"
version = "1.3.1"
description = "AstrBot native Xiaoheihe platform adapter"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "RyanVaderAn" }]
dependencies = [
  "aiosqlite>=0.20.0,<1",
  "httpx>=0.27.0,<1",
  "qrcode[pil]>=8.0,<9",
]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.setuptools]
packages = ["xiaoheihe"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["xiaoheihe"]

[tool.coverage.report]
show_missing = true
skip_covered = true
