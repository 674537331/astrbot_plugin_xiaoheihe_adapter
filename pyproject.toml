[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-plugin-xiaoheihe-adapter"
version = "1.2.13"
description = "AstrBot native Xiaoheihe platform adapter"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "RyanVaderAn" }]
dependencies = [
  "aiosqlite>=0.20.0,<1",
  "httpx>=0.27.0,<1",
  "qrcode[pil]>=8.0,<9",
]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.setuptools]
packages = ["xiaoheihe"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108", "S311"]
"xiaoheihe/api_client.py" = ["S311"]
"xiaoheihe/rate_limiter.py" = ["S311"]
"xiaoheihe/notification_service.py" = ["S311"]
# Dynamic SQL identifiers and predicates in this module come only from fixed allowlists.
"xiaoheihe/repository.py" = ["S608"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires explicitly enabled external integration",
  "compatibility: validates the AstrBot public API contract",
]

[tool.coverage.run]
branch = true
source = ["xiaoheihe"]
omit = ["xiaoheihe/adapter.py", "xiaoheihe/event.py", "xiaoheihe/web_api.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = ["work", "outputs", "tests"]
