name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-v133:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v1.3.3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.3.3
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply final v1.3.3 patch
        run: |
          python tools/finalize_v133.py
          python tools/v133_version_sync.py
      - name: Validate final patch before push
        run: |
          python -m pip install -e ".[test]" ruff PyYAML
          ruff format main.py tests/test_main_contract.py tools/finalize_v133.py tools/v133_version_sync.py
          ruff check main.py tests/test_main_contract.py
          python tools/validate_repository.py
          pytest -q tests/test_main_contract.py tests/test_v133_relevance.py
      - name: Restore normal CI, remove one-shot files and push
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f tools/finalize_v133.py tools/v133_version_sync.py .github/workflows/v133_finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: finalize v1.3.3 context relevance routing"
          git push origin HEAD:release/v1.3.3

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]" ruff PyYAML
      - name: JSON, YAML, page and package checks
        run: python tools/validate_repository.py
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Python compile smoke
        run: python -m compileall -q .
      - name: Frontend JavaScript syntax
        run: |
          node --check pages/xiaoheihe/app.js
          node --check pages/xiaoheihe/topic_probe.js
      - name: AstrBot API stub import smoke
        run: >-
          python -c "from tests.astrbot_stubs import install; install();
          import xiaoheihe.adapter, xiaoheihe.event, xiaoheihe.web_api"
      - name: Tests and coverage
        run: |
          coverage run -m pytest -q
          coverage report
          coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  astrbot-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot-version: ["4.24.2", "4.26.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install AstrBot package without heavy runtime dependencies
        run: python -m pip install --no-deps "AstrBot==${{ matrix.astrbot-version }}"
      - name: Validate required AstrBot files and symbols
        run: >-
          python tools/check_astrbot_contract.py
          --expected-version "${{ matrix.astrbot-version }}"

  astrbot-latest-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install latest supported AstrBot package
        run: python -m pip install --no-deps "AstrBot>=4.24.2,<5"
      - name: Validate latest stable AstrBot API contract
        run: python tools/check_astrbot_contract.py
