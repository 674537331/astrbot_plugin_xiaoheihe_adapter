name: v1.3.3 apply

on:
  push:
    branches:
      - release/v1.3.3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.3.3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply core patch
        run: python tools/apply_v133_patch.py
      - name: Format and lint changed Python
        run: |
          python -m pip install --disable-pip-version-check ruff==0.12.12
          ruff format main.py xiaoheihe/context_builder.py xiaoheihe/context_compression.py xiaoheihe/context_relevance.py xiaoheihe/models.py xiaoheihe/adapter.py tests/test_context_builder.py tests/test_adapter.py tests/test_v133_relevance.py
          ruff check main.py xiaoheihe/context_builder.py xiaoheihe/context_compression.py xiaoheihe/context_relevance.py xiaoheihe/models.py xiaoheihe/adapter.py tests/test_context_builder.py tests/test_adapter.py tests/test_v133_relevance.py
      - name: Remove one-shot patch files
        run: rm -f tools/apply_v133_patch.py .github/workflows/v133_apply.yml
      - name: Commit core patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: route thread context by local relevance"
          git push origin HEAD:release/v1.3.3
