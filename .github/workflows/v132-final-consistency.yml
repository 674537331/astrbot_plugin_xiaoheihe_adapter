name: v1.3.2 final consistency fix

on:
  push:
    branches:
      - chore/v1.3.2-final-consistency
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/v1.3.2-final-consistency
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply exact final consistency fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "main.py",
              "from .xiaoheihe.adapter import XiaoheihePlatformAdapter  # noqa: F401\n",
              "from .xiaoheihe import __version__\nfrom .xiaoheihe.adapter import XiaoheihePlatformAdapter  # noqa: F401\n",
          )
          replace_once(
              "main.py",
              '    "1.2.17",\n)\nclass XiaoheiheAdapterPlugin(Star):',
              '    __version__,\n)\nclass XiaoheiheAdapterPlugin(Star):',
          )

          replace_once(
              "xiaoheihe/runtime.py",
              "from typing import Any\n\nfrom .api_client import (\n",
              "from typing import Any\n\nfrom . import __version__\nfrom .api_client import (\n",
          )
          replace_once(
              "xiaoheihe/runtime.py",
              '            "version": "v1.2.17",\n',
              '            "version": f"v{__version__}",\n',
          )

          replace_once(
              "tests/test_runtime.py",
              "import pytest\n\nfrom xiaoheihe.api_client import SendUncertainError, XiaoheiheApiError\n",
              "import pytest\n\nfrom xiaoheihe import __version__\nfrom xiaoheihe.api_client import SendUncertainError, XiaoheiheApiError\n",
          )
          replace_once(
              "tests/test_runtime.py",
              '    assert status["version"] == "v1.2.17"\n',
              '    assert status["version"] == f"v{__version__}"\n',
          )

          harness = Path("tests/fixtures/approval_page_harness.html")
          harness_text = harness.read_text(encoding="utf-8")
          if harness_text.count("v1.2.17") != 2:
              raise SystemExit("approval_page_harness.html: expected two v1.2.17 fixture markers")
          harness.write_text(harness_text.replace("v1.2.17", "v1.3.2"), encoding="utf-8")

          validator = Path("tools/validate_repository.py")
          text = validator.read_text(encoding="utf-8")
          anchor = '''    web_api = (ROOT / "xiaoheihe" / "web_api.py").read_text(encoding="utf-8")\n    stale_literal = re.search(r'"version"\\s*:\\s*"v\\d+\\.\\d+\\.\\d+"', web_api)\n    if stale_literal:\n        failures.append("xiaoheihe/web_api.py: diagnostics version must use package __version__")\n\n'''
          insertion = anchor + '''    main_source = (ROOT / "main.py").read_text(encoding="utf-8")\n    register_match = re.search(r"@register\\((.*?)\\)\\s*class XiaoheiheAdapterPlugin", main_source, re.S)\n    if register_match is None or "__version__" not in register_match.group(1):\n        failures.append("main.py: @register version must use package __version__")\n\n    runtime_source = (ROOT / "xiaoheihe" / "runtime.py").read_text(encoding="utf-8")\n    if '\"version\": f\"v{__version__}\"' not in runtime_source:\n        failures.append("xiaoheihe/runtime.py: status version must use package __version__")\n\n    approval_harness = (ROOT / "tests" / "fixtures" / "approval_page_harness.html").read_text(\n        encoding="utf-8"\n    )\n    if f'version: \"v{expected}\"' not in approval_harness:\n        failures.append(f"approval_page_harness.html: status fixture must be v{expected}")\n    if f'index.html?v={expected}' not in approval_harness:\n        failures.append(f"approval_page_harness.html: page cache marker must be v{expected}")\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("validate_repository.py: release validation anchor not found exactly once")
          validator.write_text(text.replace(anchor, insertion, 1), encoding="utf-8")

          workflow = Path(".github/workflows/v132-final-consistency.yml")
          workflow.unlink()
          PY
      - name: Install test dependencies
        run: python -m pip install -e ".[test]" ruff PyYAML
      - name: Format
        run: ruff format main.py xiaoheihe/runtime.py tests/test_runtime.py tools/validate_repository.py
      - name: Validate
        run: |
          python tools/validate_repository.py
          ruff check .
          ruff format --check .
          python -m compileall -q .
          node --check pages/xiaoheihe/app.js
          node --check pages/xiaoheihe/topic_probe.js
          coverage run -m pytest -q
          coverage report
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align v1.3.2 runtime version metadata"
          git push origin HEAD:chore/v1.3.2-final-consistency
